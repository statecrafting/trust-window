# spec-spine governing the trust-window repository (dogfood).
#
# trust-window vends a single-crate rolling-window trust scorer; its own specs/
# corpus is governed by the published spec-spine library, pinned as a dev
# dependency and invoked as `npx --no-install spec-spine {compile,lint,index
# check,couple}`. This is the same dogfooding pattern spec-spine, OAP,
# tenant-emit, tenant-tail, and canonical-keysort-json all follow.

[manifest]
metadata_namespace = "trust-window"

[domains]
allowed = []        # disabled: this repo's specs do not declare a `domain`

[kind]
allowed = []        # disabled: `kind` is free-text (symmetric with [domains])

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
cargo_workspace = "Cargo.toml"
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = []
standalone_npm_packages    = []

[index]
extra_hashed_inputs = ["standards/**", ".github/workflows/**"]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build"]

[branding]
compiler_id = "spec-spine"
indexer_id  = "spec-spine"

[coupling]
bypass_prefixes = ["**/README.md"]
waiver_keyword = "Spec-Drift-Waiver:"

[frontmatter]
extra_known_keys = []
