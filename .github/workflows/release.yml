name: release

# Tag-gated crates.io release. Push a tag `vX.Y.Z` (matching the Cargo.toml
# version) to publish.
on:
  push:
    tags: ["v*"]

jobs:
  publish-crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep -m1 '^version = ' Cargo.toml | tr -d '" ' | cut -d= -f2)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} (=${TAG}) does not match Cargo.toml version ${VER}"
            exit 1
          fi
          echo "tag and version agree on ${VER}"

      - name: cargo publish (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if out="$(cargo publish --locked 2>&1)"; then
            echo "$out"
            echo ">> published"
          else
            echo "$out"
            if echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo ">> this version is already on crates.io, skipping (idempotent)"
            else
              exit 1
            fi
          fi

  github-release:
    name: create GitHub Release
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
